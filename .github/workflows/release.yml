name: release

# Tag push (`v0.1.0`, …) → build the browser runtime per platform, package it
# per senclaw/docs/runtime-protocol.md §2.3 (`make package`), publish the
# archives + sha256 on the GitHub release. Checks out SenClaw/senclaw as a
# sibling directory so the `../senclaw/crates/sen-runtime-sdk` path dependency
# resolves. The daemon's runtime catalog (senclaw `runtimes/index.json`) then
# lists the release with each archive's URL, sha256 and size.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          # darwin-x64 and linux-arm64 are declared in senclaw-runtime.json's
          # platform list; build them with `make package` on that hardware.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: sen-browser
      - uses: actions/checkout@v4
        with:
          repository: SenClaw/senclaw
          path: senclaw
      - uses: dtolnay/rust-toolchain@stable
      - name: unit tests
        working-directory: sen-browser
        shell: bash
        run: cargo test --lib
      - name: make package
        working-directory: sen-browser
        shell: bash
        env:
          CARGO_BUILD_JOBS: "4"
        run: make package
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            sen-browser/dist/*.tar.gz
            sen-browser/dist/*.tar.gz.sha256
